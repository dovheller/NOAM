<div class="panel">
  <div class="row" style="margin-bottom:16px"><div><h1>מסך נועם</h1>
    <div class="muted" style="font-size:13px;margin-top:4px">טרמינל המפעיל · בטוח לצפייה — אין בו תוכן, תמונות או שמות תיקיות.</div></div>
    <div class="grow"></div><span class="chip ok">מצב פרטיות: קפדני</span></div>
  <div class="term" style="padding:0;overflow:hidden">
    <div class="dim" style="padding:8px 14px;background:#131c2b;border-bottom:1px solid #1f2a3b">{{ s.station.operator }}@{{ s.station.id }} · content access: none</div>
    <div id="term-out" style="height:380px;overflow-y:auto;padding:12px 16px">
      <div class="dim">help — רשימת פקודות</div>
      {% for kind, text in s.shell %}<div class="{{ kind }}" dir="auto">{% if kind == "cmd" %}$ {% endif %}{{ text }}</div>{% endfor %}
    </div>
    <form id="shell-form" hx-post="/op/shell" hx-swap="none" style="display:flex;padding:8px 16px;border-top:1px solid #1f2a3b">
      <label for="cmd" class="dim" style="margin:0 0 0 8px">$</label>
      <input id="cmd" name="cmd" type="text" autocomplete="off" spellcheck="false" style="flex:1;background:transparent;border:0;color:#e6edf5;font-family:var(--mono);direction:ltr">
    </form>
  </div>
</div>
