{%- set p = c.progress -%}
<div class="center" style="max-width:720px;margin:30px auto">
  <div class="spinner" style="width:66px;height:66px;border-width:5px;margin:0 auto"></div>
  <h1 style="margin-top:24px">{{ t.progress_title }}</h1>
  <p class="lead">{{ t.progress_sub }}</p>
  {% if p %}
  <div class="bar" style="height:26px;margin:28px 0 12px"><i style="width:{{ p.percent }}%"></i></div>
  <b style="font-size:28px;color:var(--navy)" class="ltr">{{ p.percent }}%</b>
  <div class="stats" style="margin-top:24px">
    <div class="stat"><span>{{ t.remaining }}</span><b class="ltr">{{ (p.total - p.verified - p.skipped) | num }}</b></div>
    <div class="stat"><span>{{ t.verified }}</span><b class="ltr" style="color:var(--ok)">{{ p.verified | num }}</b></div>
  </div>
  {% endif %}
</div>
