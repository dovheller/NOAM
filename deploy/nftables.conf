#!/usr/sbin/nft -f
# NOAM — רשת סגורה (ADR 0003). שום דבר לא יוצא מהעמדה; הטאבלט ברשת 10.77.0.0/24 מגיע רק לפורט 8000.
flush ruleset

table inet noam {
  chain input {
    type filter hook input priority 0; policy drop;
    iif lo accept
    ct state established,related accept
    ip saddr 10.77.0.0/24 tcp dport 8000 accept      # הטאבלט
    ip saddr 10.77.0.0/24 udp dport 67 accept         # DHCP אם העמדה משמשת שרת
    icmp type echo-request ip saddr 10.77.0.0/24 accept
  }
  chain output {
    type filter hook output priority 0; policy drop;
    oif lo accept
    ct state established,related accept
    ip daddr 10.77.0.0/24 accept                      # תשובות ושכבת הרשת הסגורה בלבד
    udp dport 68 accept
  }
  chain forward {
    type filter hook forward priority 0; policy drop;
  }
}
