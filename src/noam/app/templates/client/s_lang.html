<div class="center" style="padding-top:20px">
  <h1>{{ t.lang_title }}</h1>
  <p class="lead">{{ t.lang_sub }}</p>
  <div class="tiles" style="max-width:820px;margin:34px auto 0;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))">
    {% for l in c.languages %}
    <button class="lang" hx-post="/cl/lang/{{ l }}" hx-swap="none" lang="{{ l }}">{{ l | langname }}</button>
    {% endfor %}
  </div>
  <div class="card" style="display:inline-block;margin-top:36px;font-size:19px">🛡 {{ t.privacy_note }}</div>
  <p class="muted">{{ t.with_you }} · {{ c.station.address }}</p>
</div>
