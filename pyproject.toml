[project]
name = "noam"
version = "0.1.0"
description = "NOAM — privacy-first backup, transfer and recovery station"
requires-python = ">=3.11"
dependencies = [
  "fpdf2>=2.7",
  "uharfbuzz>=0.39",          # fpdf2 text shaping: עברית + לועזית באותה שורה
  "pyhanko>=0.25",            # PAdES בתוך ה-PDF
  "pyzipper>=0.3",
  "cryptography>=42",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",  # כולל websockets
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
]

[project.scripts]
noam-station = "noam.app.main:main"

[project.optional-dependencies]
layer2 = ["whatsapp-chat-exporter"]
consolidate = ["imagehash>=4.3", "filetype>=1.2", "libarchive-c>=5"]
dev = ["pytest>=8", "ruff>=0.5", "pre-commit>=3.7", "pypdf>=4", "bagit>=1.8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"noam.report" = ["fonts/*"]
"noam.app" = ["static/*", "static/vendor/*", "static/fonts/*", "templates/*.html", "templates/*/*.html", "i18n/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = [
  "mtp: requires a real MTP device attached",
]
