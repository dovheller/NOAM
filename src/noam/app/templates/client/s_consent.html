<div style="max-width:760px;margin:0 auto">
  <h1>{{ t.consent_title }}</h1>
  <p class="lead">{{ t.consent_sub }}</p>
  <div class="card" style="margin-top:20px;font-size:18px;line-height:1.9">
    <b>{{ t.what_happens }}</b>
    <div>· {{ t.c1 | replace("{n}", c.selection.count | num) | replace("{size}", c.selection.bytes | size) }}</div>
    <div>· {{ t.c2 }}</div><div>· {{ t.c3 }}</div><div>· {{ t.c4 }}</div><div>· {{ t.c5 }}</div>
  </div>
  <div class="card" style="margin-top:16px">
    <div class="row"><b>{{ t.signature }}</b><span class="muted" style="font-size:15px">{{ t.sign_here }}</span><div class="grow"></div>
      <button id="sig-clear" class="btn ghost" type="button" style="min-height:48px">{{ t.clear_sig }}</button></div>
    <canvas id="sig" class="sig" style="margin-top:10px" aria-label="{{ t.sign_here }}"></canvas>
  </div>
  <div class="row" style="margin-top:18px">
    <button class="btn ghost" hx-post="/cl/back" hx-swap="none">{{ t.back }}</button>
    <div class="grow"></div>
    <button id="sig-submit" class="btn ok" hx-post="/cl/consent" hx-swap="none" disabled>{{ t.approve }}</button>
  </div>
</div>
